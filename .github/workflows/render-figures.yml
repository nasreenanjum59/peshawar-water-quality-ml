name: Render archived ML figures

on:
  push:
    branches: [main]
    paths:
      - 'src/plot_archived_ml_figures.py'
      - '.github/workflows/render-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.2.3" "matplotlib==3.9.4" "scikit-learn==1.6.1"
      - name: Regenerate plots from frozen predictions
        run: python src/plot_archived_ml_figures.py
      - name: Commit four PNG outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures/*.png
          if git diff --cached --quiet; then
            echo "Plot files are already current."
          else
            git commit -m "Regenerate four ML diagnostic figures from archived results"
            git push
          fi
